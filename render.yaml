services:
  # ── AccessGuard AI Backend (FastAPI Web Service) ──────────────────────────
  - type: web
    name: accessguard-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: STORAGE_BACKEND
        value: sqlite
      - key: SQLITE_DB_PATH
        value: ./data/accessguard.db
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: DemoAdmin2026!
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: LOG_LEVEL
        value: INFO
      - key: IF_CONTAMINATION
        value: "0.08"
      - key: IF_N_ESTIMATORS
        value: "200"
      - key: IF_RANDOM_STATE
        value: "42"

  # ── React Frontend (Free Static Site) ─────────────────────────────────────
  - type: web
    name: accessguard-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: accessguard-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
